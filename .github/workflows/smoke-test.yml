name: Teste no emulador
# (no celular: Actions > "Teste no emulador" > Run workflow)
# Installs the published APK on an Android emulator, opens it, drives a simulated trip with the GPS (about 2 km, with slow
# traffic and stops) and checks that nothing crashed. The screenshots and the log are kept with the run.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download app --repo "${{ github.repository }}" --pattern HorizonNav-BR.apk --dir .
      - name: Write the test script
        run: |
          cat > drive.sh <<'EOF'
          set -x
          APP=com.headunit.nav.br
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb install -r -g HorizonNav-BR.apk
          adb shell pm grant $APP android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm grant $APP android.permission.POST_NOTIFICATIONS || true
          mkdir -p out
          # taps the on-screen text $1 (found with uiautomator)
          tap() {
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1; adb pull /sdcard/ui.xml ui.xml > /dev/null 2>&1
            xy=$(python3 -c "
          import re,sys
          x=open('ui.xml',encoding='utf-8').read()
          m=re.search(r'text=\"'+re.escape(sys.argv[1])+r'\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"',x)
          print(f'{(int(m[1])+int(m[3]))//2} {(int(m[2])+int(m[4]))//2}' if m else '')" "$1")
            if [ -n "$xy" ]; then adb shell input tap $xy; echo "tocou em '$1'"; else echo "não achou '$1'"; fi
          }
          lat=-5.0920; lon=-42.8038
          fixat() { adb emu geo fix $lon $lat 70 8 $1 > /dev/null; }
          step() { # $1 metres per second, $2 seconds, $3 knots
            for i in $(seq 1 $2); do
              lat=$(python3 -c "print(f'{$lat + $1/111320:.7f}')")
              fixat $3; sleep 1
            done
          }
          fixat 0
          adb logcat -c
          adb shell monkey -p $APP -c android.intent.category.LAUNCHER 1
          sleep 20
          adb exec-out screencap -p > out/1-aberto.png
          tap "Pular configuração"; sleep 4
          adb exec-out screencap -p > out/2-mapa.png
          # a trip north through Teresina, ~1.3 km: 50 km/h, slow traffic (5 km/h), 40 km/h
          step 13.9 40 27
          step 1.4 60 2.7
          step 11.1 60 21.6
          adb exec-out screencap -p > out/3-dirigindo.png
          step 0 25 0
          # Android closes the app in the middle of the trip: it must carry on from the last snapshot, not lose it
          adb shell am force-stop $APP
          sleep 3
          adb shell monkey -p $APP -c android.intent.category.LAUNCHER 1
          sleep 10
          step 8.3 30 16
          # stopped for over two minutes: the trip ends and is saved
          step 0 140 0
          adb exec-out screencap -p > out/4-fim.png
          adb logcat -d > out/logcat.txt
          pidof=$(adb shell pidof $APP)
          echo "app process: $pidof"
          grep -E "FATAL EXCEPTION|AndroidRuntime: (FATAL|java|Process)|NavEngine: " out/logcat.txt | head -60 > out/erros.txt || true
          cat out/erros.txt
          grep -E "$APP|NavEngine" out/logcat.txt | grep -E " E | W " | tail -60 > out/avisos.txt || true
          if grep -A3 "FATAL EXCEPTION" out/logcat.txt | grep -q "$APP"; then echo "::error::O app travou (veja logcat.txt)"; exit 1; fi
          if grep -q "trip failed" out/logcat.txt; then echo "::error::Erro na contagem de km (veja logcat.txt)"; exit 1; fi
          [ -n "$pidof" ] || { echo "::error::O app não está aberto no fim do teste"; exit 1; }
          grep -q "trip resumed" out/logcat.txt || echo "::warning::A viagem não foi retomada depois que o app fechou"
          saved=$(grep -o "trip saved [0-9]* m" out/logcat.txt | tail -1 | grep -o "[0-9]*")
          echo "viagem salva: ${saved:-nenhuma} m (esperado ~1550 m)"
          [ -n "$saved" ] || { echo "::error::A viagem não foi salva"; exit 1; }
          [ "$saved" -gt 1300 ] && [ "$saved" -lt 1800 ] || { echo "::error::Km fora do esperado: $saved m"; exit 1; }
          echo "OK: nenhum travamento e km certo"
          EOF
      - name: Run the emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash drive.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-emulador
          path: out/
      # the screenshots and the log also go on a "teste-emulador" release (easy to open from a phone)
      - name: Publish the results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create teste-emulador --repo "${{ github.repository }}" --title "Teste no emulador" --notes "Resultado do último teste" --prerelease --latest=false 2>/dev/null || true
          gh release edit teste-emulador --repo "${{ github.repository }}" --notes "Resultado do teste de $(date -u '+%d/%m/%Y %H:%M') UTC"
          [ -f out/logcat.txt ] && gzip -kf out/logcat.txt
          for f in out/*.png out/erros.txt out/avisos.txt out/logcat.txt.gz; do [ -f "$f" ] && gh release upload teste-emulador "$f" --repo "${{ github.repository }}" --clobber; done
