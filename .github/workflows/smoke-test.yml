name: Teste no emulador
# (no celular: Actions > "Teste no emulador" > Run workflow)
# Installs the published APK on an Android emulator, opens it, drives a simulated trip with the GPS (about 2 km, with slow
# traffic and stops) and checks that nothing crashed. The screenshots and the log are kept with the run.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download app --repo "${{ github.repository }}" --pattern HorizonNav-BR.apk --dir .
      - name: Write the test script
        run: |
          cat > drive.sh <<'EOF'
          set -x
          APP=com.headunit.nav.br
          adb install -r -g HorizonNav-BR.apk
          adb shell pm grant $APP android.permission.ACCESS_FINE_LOCATION || true
          adb shell pm grant $APP android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          adb shell monkey -p $APP -c android.intent.category.LAUNCHER 1
          sleep 25
          mkdir -p out
          adb exec-out screencap -p > out/1-aberto.png
          # a trip in Teresina: north along a straight line, ~2 km; 50 km/h, slow traffic (5 km/h), a 60 s stop, 40 km/h
          lat=-5.0920; lon=-42.8038
          step() { # $1 metres per second, $2 seconds, $3 knots
            for i in $(seq 1 $2); do
              lat=$(python3 -c "print(f'{$lat + $1/111320:.7f}')")
              adb emu geo fix $lon $lat 70 8 $3 > /dev/null
              sleep 1
            done
          }
          step 13.9 40 27
          step 1.4 60 2.7
          step 0 60 0
          step 11.1 60 21.6
          adb exec-out screencap -p > out/2-dirigindo.png
          step 0 20 0
          adb shell am start -n $APP/com.headunit.launcher.MainActivity > /dev/null 2>&1 || true
          sleep 5
          adb exec-out screencap -p > out/3-fim.png
          # the app closed and reopened (as when Android stops it): the trip must be kept, not lost
          adb shell am force-stop $APP
          sleep 2
          adb shell monkey -p $APP -c android.intent.category.LAUNCHER 1
          sleep 15
          adb exec-out screencap -p > out/4-reaberto.png
          adb logcat -d > out/logcat.txt
          pidof=$(adb shell pidof $APP)
          echo "app process: $pidof"
          grep -E "FATAL EXCEPTION|AndroidRuntime: |NavEngine: (trip failed|road info failed)" out/logcat.txt | head -40 > out/erros.txt || true
          cat out/erros.txt
          if grep -q "FATAL EXCEPTION" out/logcat.txt && grep -A3 "FATAL EXCEPTION" out/logcat.txt | grep -q "$APP"; then echo "::error::O app travou (veja logcat.txt)"; exit 1; fi
          if grep -q "trip failed" out/logcat.txt; then echo "::error::Erro na contagem de km (veja logcat.txt)"; exit 1; fi
          [ -n "$pidof" ] || { echo "::error::O app não está aberto no fim do teste"; exit 1; }
          echo "OK: nenhum travamento"
          EOF
      - name: Run the emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash drive.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-emulador
          path: out/
