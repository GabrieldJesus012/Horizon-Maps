          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail . | tail -1)" ]; then
            sudo mkdir -p /mnt/data && sudo chown "$USER" /mnt/data && ln -s /mnt/data data
          else
            mkdir -p data
          fi
          df -h . /mnt || true
          # lots of jobs start together, so spread their downloads out a little, and keep trying if the server is busy;
          # if Geofabrik won't give it, the same extract is fetched from the openstreetmap.fr mirror instead
