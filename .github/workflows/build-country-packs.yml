          P="${{ matrix.area.path }}"
          ok=""
          for U in "https://download.geofabrik.de/$P-latest.osm.pbf" "https://download.openstreetmap.fr/extracts/$P.osm.pbf"; do
            for try in 1 2 3 4 5 6; do
              echo "Downloading $U (try $try)"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 30 --connect-timeout 30 -A "HorizonNav-pack-builder" -o data/region.osm.pbf "$U" \
                 && [ "$(stat -c%s data/region.osm.pbf)" -gt 10000 ]; then ok=1; break; fi
              rm -f data/region.osm.pbf
              sleep $(( 60 * try ))
            done
            [ -n "$ok" ] && break
          done
          [ -n "$ok" ] || { echo "Couldn't download $P from Geofabrik or the mirror - check the path on download.geofabrik.de"; exit 1; }
          ls -l data
