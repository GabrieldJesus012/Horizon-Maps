                  if h in seen: continue
                  seen.add(h)
                  out.write("%s\t%s\t%s\t%.5f\t%.5f\t%s\n" % (key(street), street, num, p[0], p[1], pc)); n += 1
                  if pc:
                      a = pcs.get(pc)
                      if a: a[0] += p[0]; a[1] += p[1]; a[2] += 1
                      else: pcs[pc] = [p[0], p[1], 1]
          with open("data/postcodes.tsv", "w", encoding="utf-8") as o:
              for pc in sorted(pcs, key=lambda x: x.replace(" ", "")):
                  a = pcs[pc]
                  o.write("%s\t%s\t%.5f\t%.5f\n" % (pc.replace(" ", "").lower(), pc, a[0] / a[2], a[1] / a[2]))
          print("addresses:", n, "postcodes:", len(pcs))
          PY
          rm -f data/addr.geojsonseq
          LC_ALL=C sort -S 4G -T data -t "$(printf '\t')" -k1,1 data/addr.unsorted | cut -f2- > data/addresses.tsv
          rm -f data/addr.unsorted
          ls -l data/addresses.tsv data/postcodes.tsv
      - name: Build street lamp and traffic light lists
        if: matrix.part == 'lists'
        run: |
          for kind in street_lamp:lamps traffic_signals:signals; do
            tag="${kind%%:*}"; out="${kind##*:}"
            osmium tags-filter data/region.osm.pbf "n/highway=$tag" -o "data/$out.osm.pbf" --overwrite
            osmium export "data/$out.osm.pbf" -f geojsonseq --geometry-types=point -o "data/$out.geojsonseq" --overwrite
            python3 - "$out" <<'PY'
          import json, math, sys
          name = sys.argv[1]; n = 0
          with open("data/%s.geojsonseq" % name, encoding="utf-8") as f, open("data/%s.unsorted" % name, "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try: lon, lat = json.loads(line)["geometry"]["coordinates"]
                  except Exception: continue
                  x = min(32767, max(0, int((lon + 180.0) / 360.0 * 32768)))
                  r = math.radians(lat)
                  y = min(32767, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * 32768)))
                  o.write("%05d%05d\t%.6f\t%.6f\n" % (y, x, lat, lon)); n += 1
          print(name, n)
          PY
            LC_ALL=C sort -S 1G -T data "data/$out.unsorted" > "data/$out.tsv"
            rm -f "data/$out.unsorted" "data/$out.osm.pbf" "data/$out.geojsonseq"
          done
          ls -l data/lamps.tsv data/signals.tsv

      # ---------------- publish ----------------
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f data/region.osm.pbf data/tz.sqlite
          # GitHub refuses release files of 2 GB or more, so a bigger file is cut into parts (the app joins them again)
          for big in tiles.tar map.pmtiles addresses.tsv places.tsv; do
            if [ -f "data/$big" ] && [ "$(stat -c%s data/$big)" -gt 1900000000 ]; then
              split -b 1800M -d -a 2 "data/$big" "data/$big.part" && rm "data/$big"
            fi
          done
          FILES=""
          for f in data/tiles.tar data/tiles.tar.part* data/admins.sqlite data/valhalla.json data/places.tsv data/places.tsv.part* data/map.pmtiles data/map.pmtiles.part* data/fonts.zip data/addresses.tsv data/addresses.tsv.part* data/postcodes.tsv data/lamps.tsv data/signals.tsv; do
            # GitHub won't take an empty file (an area with no traffic lights mapped, say): the app copes without it
            [ -s "$f" ] && FILES="$FILES $f"
          done
          [ -n "$FILES" ] || { echo "Nothing to publish"; exit 1; }
          ls -l $FILES
          gh release upload "${{ matrix.area.tag }}" $FILES --repo "${{ github.repository }}" --clobber
          echo "Download address: https://github.com/${{ github.repository }}/releases/download/${{ matrix.area.tag }}"
